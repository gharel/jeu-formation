<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Le Juste Chiffre · Mini-jeux · Skazy Formation</title>
    <meta
      name="description"
      content="Estimez un chiffre du numérique&nbsp;: le jeu répond «&nbsp;c’est plus&nbsp;» ou «&nbsp;c’est moins&nbsp;». Un jeu à projeter pour animer une formation."
    />
    <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../assets/css/charte.css" />
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/solid.min.css" />
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/regular.min.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/composants.css" />
    <link rel="stylesheet" href="jeu.css" />
    <script type="module" src="jeu.js"></script>
  </head>
  <body data-jeu="juste-chiffre" data-couleur="bleu">
    <a class="lien-evitement" href="#cadre">Aller au jeu</a>
    <header class="bandeau">
      <a
        class="bouton-bandeau bandeau__accueil"
        href="../../"
        title="Retour à l’accueil des mini-jeux"
      >
        <i class="fa-solid fa-house icone" aria-hidden="true"></i>
        <span class="bandeau__accueil-texte">Accueil</span>
      </a>
      <h1 class="bandeau__titre">Le Juste Chiffre</h1>
      <div class="bandeau__actions" id="actions"></div>
      <div class="signature bandeau__signature">
        <a
          class="signature__logo"
          href="https://formation.skazy.nc"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="../../assets/img/logo-skazy-formation-blanc.svg"
            alt="Site de Skazy Formation (nouvel onglet)"
            width="109"
            height="36"
          />
        </a>
        <p class="signature__outil">
          <img
            class="signature__pastille"
            src="../../assets/img/favicon.svg"
            width="28"
            height="28"
            alt=""
          />
          <span class="signature__nom">Mini-jeux</span>
        </p>
      </div>
    </header>
    <main id="cadre" class="cadre" tabindex="-1">
      <noscript>Ce jeu a besoin de JavaScript pour fonctionner.</noscript>
    </main>
    <footer class="pied">
      <p class="pied__mentions">
        &copy; Skazy Formation&nbsp;· Usage réservé aux stagiaires de Skazy Formation&nbsp;:
        reproduction et réutilisation dans une autre formation interdites sans accord écrit.
      </p>
    </footer>
    <div id="annonces" class="visuellement-cache" aria-live="polite"></div>
  </body>
</html>
