<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Le groupe · Mini-jeux · Skazy Formation</title>
    <meta
      name="description"
      content="Les prénoms du groupe, une info sur chacun, le plan de salle (en U, classe, îlots, réunion) pour retenir qui est assis où, et les scores de tous les jeux."
    />
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/charte.css" />
    <link rel="stylesheet" href="../assets/vendor/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="../assets/vendor/fontawesome/css/solid.min.css" />
    <link rel="stylesheet" href="../assets/vendor/fontawesome/css/regular.min.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/composants.css" />
    <script type="module" src="../assets/js/groupe.js"></script>
  </head>
  <body data-couleur="vert">
    <a class="lien-evitement" href="#cadre">Aller au groupe</a>
    <header class="bandeau">
      <a
        class="bouton-bandeau bandeau__accueil"
        href="../"
        title="Retour à l’accueil des mini-jeux"
      >
        <i class="fa-solid fa-house icone" aria-hidden="true"></i>
        <span class="bandeau__accueil-texte">Accueil</span>
      </a>
      <span class="signature__filet bandeau__filet" aria-hidden="true"></span>
      <a class="signature__outil bandeau__outil" href="../" title="Accueil des mini-jeux">
        <img
          class="signature__pastille"
          src="../assets/img/favicon.svg"
          width="28"
          height="28"
          alt=""
        />
        <span class="signature__nom">Mini-jeux</span>
      </a>
      <h1 class="bandeau__titre">Le groupe</h1>
      <div class="bandeau__actions" id="actions"></div>
      <div class="signature bandeau__signature">
        <a
          class="lien-outils"
          href="https://gharel.github.io/home/"
          title="Tous les outils Skazy Formation"
        >
          <img
            class="lien-outils__roue"
            src="../assets/img/les-outils.svg"
            width="26"
            height="26"
            alt=""
          />
          <span class="lien-outils__texte">Les outils</span>
        </a>
        <span class="signature__filet" aria-hidden="true"></span>
        <a
          class="signature__logo"
          href="https://formation.skazy.nc"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="../assets/img/logo-skazy-formation-blanc.svg"
            alt="Site de Skazy Formation (nouvel onglet)"
            width="109"
            height="36"
          />
        </a>
      </div>
    </header>
    <main id="cadre" class="cadre" tabindex="-1">
      <noscript>Cette page a besoin de JavaScript pour fonctionner.</noscript>
    </main>
    <footer class="pied">
      <p class="pied__mentions">
        &copy; Skazy Formation&nbsp;· Usage réservé aux stagiaires de Skazy Formation&nbsp;:
        reproduction et réutilisation dans une autre formation interdites sans accord écrit.
      </p>
    </footer>
    <div id="annonces" class="visuellement-cache" aria-live="polite"></div>
  </body>
</html>
